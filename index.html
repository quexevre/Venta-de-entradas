<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Oficial - Timpulso</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h2 { color: #2ecc71; }

        /* SELECTOR */
        .selector-tipo {
            background: #333;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #555;
            font-size: 16px;
            cursor: pointer;
        }

        /* GRID BASE MAPA */
        .grid-base {
            display: grid;
            grid-template-columns: 40px repeat(7, 40px) 80px repeat(7, 40px);
            justify-content: center;
            gap: 4px;
        }

        .escenario-container { margin: 30px 0 15px 0; }

        .escenario {
            grid-column: 2 / 17;
            background: #444;
            padding: 15px 0;
            border-radius: 10px;
            font-weight: bold;
            letter-spacing: 4px;
            border-bottom: 3px solid #2ecc71;
        }

        .fila { margin: 6px 0; align-items: center; }
        .letra { font-weight: bold; text-align: center; color: #888; }

        /* ASIENTOS */
        .asiento {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .vip { background: gold; color: black; }
        .vip:hover { transform: scale(1.1); }
        
        .seleccionado { 
            background: #ff4757 !important; 
            color: white !important; 
            box-shadow: 0 0 10px #ff4757;
        }

        .ocupado {
            background: #444 !important;
            color: #777 !important;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* PANEL GENERAL */
        .general-panel {
            width: 280px;
            background: #2ecc71;
            margin: 30px auto;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-weight: bold;
            font-size: 22px;
            color: black;
        }

        .btn-qty {
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            border: none;
            border-radius: 50%;
            background: white;
        }

        .btn-confirmar {
            margin: 30px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-confirmar:hover { background: #27ae60; transform: translateY(-3px); }
        .btn-confirmar:disabled { background: #555; cursor: not-allowed; }

        /* MODAL REGISTRO */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
        }

        .modal-content {
            background: #222;
            margin: 10% auto;
            padding: 25px;
            border: 1px solid #2ecc71;
            width: 320px;
            border-radius: 15px;
            text-align: left;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: white;
            box-sizing: border-box;
        }

        .btn-reg {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h2>Sistema de Ventas - Alma para Conquistarte</h2>

    <select id="tipoEntrada" class="selector-tipo" onchange="cambiarTipo()">
        <option value="VIP">Zona VIP (Numerada)</option>
        <option value="GENERAL">Zona General</option>
    </select>

    <div id="contenedorVIP">
        <div class="escenario-container grid-base">
            <div></div>
            <div class="escenario">ESCENARIO</div>
        </div>
        <div id="mapaVIP">Cargando asientos desde la nube...</div>
    </div>

    <div id="contenedorGeneral" style="display:none;">
        <div class="general-panel">
            <button class="btn-qty" onclick="modificarGeneral(-1)">−</button>
            <span id="contadorGeneral">0</span>
            <button class="btn-qty" onclick="modificarGeneral(1)">+</button>
        </div>
    </div>

    <button id="btnFinalizar" class="btn-confirmar" onclick="abrirRegistro()">Confirmar y Descargar</button>

    <div id="modalRegistro" class="modal">
        <div class="modal-content">
            <h3 style="color:#2ecc71; text-align:center;">Datos del Cliente</h3>
            <input type="text" id="cNombre" placeholder="Apellidos y Nombres">
            <input type="text" id="cDNI" placeholder="DNI">
            <input type="text" id="cCel" placeholder="Celular">
            <button class="btn-reg" onclick="validarYProcesar()">Finalizar Venta</button>
            <button class="btn-reg" style="background:#555" onclick="cerrarRegistro()">Cancelar</button>
        </div>
    </div>

    <script>
        // URL DE TU PROPIA APLICACIÓN DE GOOGLE
        const URL_APP = "https://script.google.com/macros/s/AKfycbyJBKGo3-F4JmLSsJ-XIpHkeh5LDxyOtYAZjHxXIybWM1DH3tIUm6lzbzXchkacKAns/exec";

        const filasVIP = ["A", "B", "C", "D", "E", "F", "G"];
        let pedido = { vip: [], general: 0 };
        let asientosOcupados = [];
        let correlativo = localStorage.getItem("correlativoGlobal") ? parseInt(localStorage.getItem("correlativoGlobal")) : 1;

        async function cargarDatos() {
            try {
                const res = await fetch(URL_APP);
                asientosOcupados = await res.json();
                crearMapa();
            } catch (e) {
                console.error("Error cargando datos", e);
                crearMapa(); 
            }
        }

        function crearMapa() {
            const mapa = document.getElementById("mapaVIP");
            mapa.innerHTML = "";

            filasVIP.forEach(fila => {
                const filaDiv = document.createElement("div");
                filaDiv.className = "fila grid-base";
                const letra = document.createElement("div");
                letra.className = "letra";
                letra.innerText = fila;
                filaDiv.appendChild(letra);

                let cantidad = (fila === "A" || fila === "B" || fila === "C") ? 13 : 14;
                if (cantidad === 13) filaDiv.appendChild(document.createElement("div"));

                for (let i = cantidad; i >= 1; i--) {
                    const idAsiento = `${fila}-${i}`;
                    const asiento = document.createElement("div");
                    const estaOcupado = asientosOcupados.includes(idAsiento);
                    
                    asiento.className = "asiento vip" + (estaOcupado ? " ocupado" : "");
                    asiento.innerText = i;
                    
                    if (!estaOcupado) {
                        asiento.onclick = () => toggleAsiento(idAsiento, asiento);
                    }
                    filaDiv.appendChild(asiento);
                }
                mapa.appendChild(filaDiv);
            });
        }

        function toggleAsiento(id, elemento) {
            const index = pedido.vip.indexOf(id);
            if (index > -1) {
                pedido.vip.splice(index, 1);
                elemento.classList.remove("seleccionado");
            } else {
                pedido.vip.push(id);
                elemento.classList.add("seleccionado");
            }
        }

        function modificarGeneral(val) {
            pedido.general = Math.max(0, pedido.general + val);
            document.getElementById("contadorGeneral").innerText = pedido.general;
        }

        function cambiarTipo() {
            const t = document.getElementById("tipoEntrada").value;
            document.getElementById("contenedorVIP").style.display = t === "VIP" ? "block" : "none";
            document.getElementById("contenedorGeneral").style.display = t === "GENERAL" ? "block" : "none";
        }

        function abrirRegistro() {
            if (pedido.vip.length + pedido.general === 0) return alert("Selecciona al menos una entrada");
            document.getElementById("modalRegistro").style.display = "block";
        }

        function cerrarRegistro() { document.getElementById("modalRegistro").style.display = "none"; }

        // --- PROCESAR VENTA (CORRECCIÓN MIXTA) ---
        async function validarYProcesar() {
            const nombre = document.getElementById("cNombre").value;
            const dni = document.getElementById("cDNI").value;
            const cel = document.getElementById("cCel").value;

            if (!nombre || !dni || !cel) return alert("Por favor, completa todos los datos.");

            const btn = document.querySelector(".btn-reg");
            btn.disabled = true;
            btn.innerText = "⏳ Guardando en Nube...";

            // Lógica para detectar tipo MIXTA
            let tipoVentaFinal = "";
            if (pedido.vip.length > 0 && pedido.general > 0) {
                tipoVentaFinal = "MIXTA";
            } else if (pedido.vip.length > 0) {
                tipoVentaFinal = "VIP";
            } else {
                tipoVentaFinal = "GENERAL";
            }

            // Preparar lista unificada de asientos para el Excel
            let listaAsientos = [...pedido.vip];
            if (pedido.general > 0) listaAsientos.push("GENERAL (" + pedido.general + ")");

            const datosVenta = {
                nroVenta: Date.now().toString().slice(-6), 
                nombre: nombre,
                dni: dni,
                celular: cel,
                asientos: listaAsientos,
                tipo: tipoVentaFinal 
            };

            try {
                // 1. Guardar en Google Sheets
                await fetch(URL_APP, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify(datosVenta)
                });

                // 2. Generar Tickets VIP
                for (let a of pedido.vip) {
                    await generarTicket("vip.jpg", String(correlativo).padStart(5, "0"), a);
                    correlativo++;
                }
                
                // 3. Generar Tickets General
                for (let i = 0; i < pedido.general; i++) {
                    await generarTicket("general.jpg", String(correlativo).padStart(5, "0"), "GENERAL");
                    correlativo++;
                }

                localStorage.setItem("correlativoGlobal", correlativo);
                alert("✅ Venta " + tipoVentaFinal + " registrada. Descargando tickets...");
                location.reload();
            } catch (e) {
                alert("Error: " + e);
                btn.disabled = false;
            }
        }

        function generarTicket(ruta, num, asiento) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = ruta;
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0);
                    
                    ctx.fillStyle = "white";
                    ctx.font = "bold 42px Arial";
                    ctx.textAlign = "left";
                    
                    // Coordenadas para los cuadros rojos de tu imagen
                    ctx.fillText(num, img.width * 0.140, img.height * 0.115);
                    ctx.fillText(num, img.width * 0.865, img.height * 0.115);
                    
                    ctx.textAlign = "center";
                    if (asiento === "GENERAL") {
                        ctx.font = "bold 55px Arial";
                        ctx.fillText("GENERAL", img.width * 0.872, img.height * 0.285);
                    } else {
                        ctx.font = "bold 45px Arial";
                        ctx.fillText("ASIENTO: " + asiento, img.width * 0.872, img.height * 0.285);
                    }
                    
                    const link = document.createElement("a");
                    link.download = `Ticket_${num}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    setTimeout(resolve, 600);
                };
            });
        }

        cargarDatos();
    </script>
</body>
</html>
